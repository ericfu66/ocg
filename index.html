/* ---------- 8.6 收藏 ---------- */
const FAV_TABS = [['all', '全部'], ['item', '条目'], ['post', '心得'], ['media', '媒体']];

async function viewFavorites(sub = 'all') {
  if (!FAV_TABS.some(([key]) => key === sub)) sub = 'all';
  const head = band({ cls: 'band-fav', title: '收藏', lead: '点过星标的游戏、运动、心得和媒体文件都在这里，方便下次再看。',
                      tabs: FAV_TABS, base: 'favorites', active: sub });
  if (!Auth.user) return { html: head + gateHTML('登录后就能收藏喜欢的内容，下次在这里找到它们。'), nav: 'favorites', title: '收藏' };

  const favs = (await DB.getByIndex('favorites', 'owner', Auth.user))
    .filter(f => sub === 'all' || f.kind === sub)
    .sort(byNewest);

  // 根据收藏记录找到原内容
  const rows = [];
  for (const f of favs) {
    let row = null;
    if (f.kind === 'item') {
      const item = await findItem(f.ref);
      if (item) row = { color: item.color, href: `#item/${item.id}`, title: item.name, desc: `${Z(item.zone).name}，${item.intro}` };
    } else if (f.kind === 'post') {
      const post = await DB.get('posts', Number(f.ref));
      if (post) row = { color: Z(post.zone).color, href: `#post/${post.id}`, title: post.title, desc: `${Z(post.zone).noteName}，${post.author} 写` };
    } else if (f.kind === 'media') {
      const m = await DB.get('media', Number(f.ref));
      if (m) {
        const info = rememberMedia(m);
        row = { color: 'var(--ink)', href: `#journal/media/${m.type}`, title: m.name, desc: `${TYPE_NAME[m.type]}，${fmtSize(m.size)}`,
                thumb: m.type === 'image' ? info.url : null };
      }
    }
    rows.push({ f, row });
  }

  const list = rows.map(({ f, row }) => row
    ? `<li class="fav-row" style="--zc:${row.color}">
        ${row.thumb ? `<img class="fav-thumb" src="${row.thumb}" alt="">` : ''}
        <div class="fav-main"><a href="${row.href}">${esc(row.title)}</a><p>${esc(row.desc)}，收藏于 ${fmtDate(f.createdAt)}</p></div>
        ${favButton(f.kind, f.ref, row.title)}
      </li>`
    : `<li class="fav-row missing">
        <div class="fav-main"><strong>${esc(f.title)}</strong><p>原内容已经被删除了。</p></div>
        ${favButton(f.kind, f.ref, f.title)}
      </li>`).join('');

  const html = head + `<div class="wrap page">
    ${rows.length ? `<ul class="fav-list">${list}</ul>`
      : emptyHTML('这里还是空的。在游戏、运动、心得或媒体文件旁边点“收藏”，它就会出现在这里。', '<a class="btn" href="#games">去游戏分区看看</a>')}
  </div>`;
  return { html, nav: 'favorites', title: '收藏' };
}

/* ---------- 8.7 搜索 ---------- */
async function viewSearch(raw = '') {
  let q = '';
  try { q = decodeURIComponent(raw).trim(); } catch { q = raw; }
  const head = band({ cls: 'band-search', title: q ? `搜索“${esc(q)}”` : '搜索',
                      lead: '在板块、条目和心得里查找；登录后还会查找你的随手记和媒体文件。' });
  const mount = () => { $('#searchInput').value = q; };
  if (!q) return { html: head + `<div class="wrap page">${emptyHTML('在顶栏的搜索框里输入关键词，比如“篮球”或“图书馆”。')}</div>`, nav: '', title: '搜索', mount };

  const has = s => String(s).toLowerCase().includes(q.toLowerCase());
  const sections = Object.values(SECTIONS).filter(sec => has(sec.name) || has(sec.lead));
  const items = (await allItems()).filter(i => [i.name, i.kind, i.intro, ...i.tags, ...i.story].some(has));
  const posts = (await DB.getAll('posts')).filter(p => has(p.title) || has(plainText(p.content))).sort(byNewest);
  const notes = Auth.user ? (await DB.getByIndex('notes', 'owner', Auth.user)).filter(n => has(n.text)).sort(byNewest) : [];
  const media = Auth.user ? (await DB.getByIndex('media', 'owner', Auth.user)).filter(m => has(m.name)).sort(byNewest) : [];

  const group = (title, count, inner) => count ? `<section class="result-group"><h2>${title}<small>${count} 条</small></h2>${inner}</section>` : '';
  const total = sections.length + items.length + posts.length + notes.length + media.length;

  const body = total ? [
    group('板块', sections.length, `<ul class="result-list">${sections.map(sec => `
      <li class="result" style="--zc:${sec.color}"><div class="result-main">
        <a href="${sec.href}">${highlight(sec.name, q)}</a>
        <p>${highlight(sec.lead, q)}</p>
      </div></li>`).join('')}</ul>`),
    group('条目', items.length, `<ul class="result-list">${items.map(i => `
      <li class="result" style="--zc:${i.color}"><div class="result-main">
        <a href="#item/${i.id}">${highlight(i.name, q)}</a>
        <p>${highlight(snippet([i.intro, ...i.story].join(''), q), q)}</p>
      </div>${favButton('item', i.id, i.name)}</li>`).join('')}</ul>`),
    group('心得', posts.length, postList(posts, q)),
    group('随手记', notes.length, `<ul class="result-list">${notes.map(n => `
      <li class="result z-${n.tag}"><div class="result-main">
        <a href="#journal/notes">随手记，${fmtDate(n.createdAt)} ${fmtTime(n.createdAt)}</a>
        <p>${highlight(snippet(n.text, q), q)}</p>
      </div></li>`).join('')}</ul>`),
    group('媒体文件', media.length, `<ul class="result-list">${media.map(m => `
      <li class="result z-media"><div class="result-main">
        <a href="#journal/media/${m.type}">${highlight(m.name, q)}</a>
        <p>${TYPE_NAME[m.type]}，${fmtSize(m.size)}，${fmtDate(m.createdAt)}</p>
      </div></li>`).join('')}</ul>`),
  ].join('') : emptyHTML(`没有找到和“${esc(q)}”有关的内容。换个关键词试试，比如“篮球”或“图书馆”。`);

  return { html: head + `<div class="wrap page">${body}</div>`, nav: '', title: `搜索 ${q}`, mount };
}

/* =================================================================
 * 9. 路由：根据地址栏 # 后面的内容显示不同页面
 *    例如 #games/notes 显示"游戏分区"的"游戏心得"子标签
 * ================================================================= */
const ROUTES = {
  home: viewHome,
  games: sub => viewZone('game', sub),
  sports: sub => viewZone('sport', sub),
  item: viewItem,
  post: viewPost,
  journal: viewJournal,
  favorites: viewFavorites,
  search: viewSearch,
  sections: viewSections,
  zone: (key, sub) => viewZone(key, sub), // 自建板块，例如 #zone/s3/notes
};

let renderSeq = 0; // 快速连续切换页面时，只显示最后一次

async function render() {
  const seq = ++renderSeq;
  const parts = location.hash.replace(/^#/, '').split('/');
  const name = parts[0] || 'home';
  const view = ROUTES[name] || ROUTES.home;

  let result;
  try {
    result = await view(...parts.slice(1));
  } catch (err) {
    console.error(err);
    result = { html: `<div class="wrap page">${emptyHTML(`页面加载失败：${esc(err.message)}。刷新一下试试。`)}</div>`, nav: '', title: '出错了' };
  }
  if (seq !== renderSeq) return;

  const main = $('#view');
  main.innerHTML = result.html;
  document.title = `${result.title} - ${SITE.name}`;
  $$('.mainnav a').forEach(a => {
    if (a.dataset.nav === result.nav) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  if (name !== 'search') $('#searchInput').value = '';

  syncFavButtons(main);
  hydrateCovers(main);
  hydrateMedia(main);
  result.mount?.();

  // 换到另一个栏目时回到页面顶部；同一栏目里切换子标签时保持位置
  if (name !== state.lastSection) window.scrollTo(0, 0);
  state.lastSection = name;
}

// 跳转；如果已经在这个地址，就直接重新渲染
function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function switchAuthTab(tab) {
  const isLogin = tab === 'login';
  $('#tabLogin').setAttribute('aria-selected', isLogin);
  $('#tabRegister').setAttribute('aria-selected', !isLogin);
  $('#loginForm').hidden = !isLogin;
  $('#registerForm').hidden = isLogin;
  $$('#authDialog .form-error').forEach(el => { el.textContent = ''; });
  $(isLogin ? '#loginForm input' : '#registerForm input').focus();
}

function openAuth(tab = 'login', note = '') {
  const dialog = $('#authDialog');
  $('#authNote').textContent = note || '';
  $('#authNote').hidden = !note;
  $('#loginForm').reset();
  $('#registerForm').reset();
  if (!dialog.open) dialog.showModal();

}

async function afterLogin(message) {
  $('#authDialog').close();
  await loadFavs();
  renderUserArea();
  toast(message);
  render();
}

function bindAccountForms() {
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    try {
      await Auth.login(f.username.value.trim(), f.password.value);
      afterLogin(`欢迎回来，${Auth.user}`);
    } catch (err) {
      $('.form-error', f).textContent = err.message;
    }
  });

  $('#registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    try {
      if (f.password.value !== f.confirm.value) throw new Error('两次输入的密码不一样。');
      await Auth.register(f.username.value.trim(), f.password.value);
      afterLogin(`注册成功，欢迎你，${Auth.user}`);
    } catch (err) {
      $('.form-error', f).textContent = err.message;
    }
  });

  $('#passwordForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    try {
      if (f.password.value !== f.confirm.value) throw new Error('两次输入的新密码不一样。');
      await Auth.changePassword(f.old.value, f.password.value);
      $('#passwordDialog').close();
      toast('密码已修改');
    } catch (err) {
      $('.form-error', f).textContent = err.message;
    }
  });

  // 点弹窗外面的灰色区域时关闭弹窗
  $$('dialog').forEach(dialog => dialog.addEventListener('click', e => {
    if (e.target !== dialog) return;
    const r = dialog.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
  }));
}

function openEntryDialog(sectionKey, record = null) {

function bindSectionForms() {
  // 颜色选择按钮
  $('#swatchRow').innerHTML = SECTION_COLORS.map(([color, label], k) =>
    `<label class="swatch" style="--c:${color}"><input type="radio" name="color" value="${color}"${k === 0 ? ' checked' : ''}>
       <span class="dot"></span><span class="sr">${label}</span></label>`).join('');

  $('#sectionForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    const record = state.editingSection;
    try {
      if (!Auth.user) throw new Error('登录状态已失效，请重新登录。');
      const name = f.sectionName.value.trim();
      if (!name) throw new Error('先给板块起个名字。');
      // 名字不能和已有板块重复（包括"游戏"会和"游戏心得"撞名的情况）
      const taken = Object.values(SECTIONS).some(sec =>
        (sec.name === name || sec.noteName === `${name}心得`) && !(record && sec.id === record.id));
      if (taken) throw new Error(`已经有叫“${name}”的板块了，换个名字。`);

      const data = { name, lead: f.lead.value.trim(), itemsLabel: f.itemsLabel.value.trim(), color: f.color.value };
      let id;
      if (record) {
        await DB.put('sections', { ...record, ...data });
        id = record.id;
      } else {
        id = await DB.add('sections', { ...data, owner: Auth.user, createdAt: Date.now() });
      }
      await loadSections();
      $('#sectionDialog').close();
      toast(record ? '板块已保存' : '板块已新建');
      go(`#zone/s${id}`);
    } catch (err) {
      $('.form-error', f).textContent = err.message;
    }
  });

  $('#entryForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    const { section, record } = state.entryCtx || {};
    try {
      if (!Auth.user) throw new Error('登录状态已失效，请重新登录。');
      const name = f.entryName.value.trim();
      if (!name) throw new Error('先写上条目的名字。');
      const file = f.cover.files[0];
      if (file && !file.type.startsWith('image/')) throw new Error('图片只能选择图片文件。');
      if (file && file.size > MAX_FILE_SIZE) throw new Error('图片不能超过 200 MB。');

      const data = {
        section, name,
        kind: f.kind.value.trim(), since: f.since.value.trim(),
        intro: f.intro.value.trim(), story: f.story.value.trim(),
        tags: f.tags.value.split(/[,，、\s]+/).filter(Boolean).slice(0, 6),
      };
      let id;
      if (record) {
        await DB.put('entries', { ...record, ...data });
        id = record.id;
      } else {
        id = await DB.add('entries', { ...data, owner: Auth.user, createdAt: Date.now() });
      }
      if (file) {
        await DB.put('covers', { itemId: 'e' + id, blob: file, by: Auth.user, updatedAt: Date.now() });
        forgetCover('e' + id);
      }
      $('#entryDialog').close();
      toast(record ? '条目已保存' : '条目已添加');
      go(`#item/e${id}`);
    } catch (err) {
      $('.form-error', f).textContent = err.message;
    }
  });
}

/* =================================================================
 * 11. 按钮点击：所有带 data-action 的按钮都在这里统一处理
 * ================================================================= */
async function toggleFav(btn) {
  if (!Auth.user) return openAuth('login', '登录后就能收藏喜欢的内容。');
  const { kind, ref, title } = btn.dataset;
  const key = `${kind}:${ref}`;
  if (state.favKeys.has(key)) {
    const record = await DB.findFav(Auth.user, kind, ref);
    if (record) await DB.delete('favorites', record.id);
    state.favKeys.delete(key);
    toast('已取消收藏');
  } else {
    try {
      await DB.add('favorites', { owner: Auth.user, kind, ref: String(ref), title, createdAt: Date.now() });
    } catch { /* 已经收藏过（比如连点两下），忽略 */ }
    state.favKeys.add(key);
    toast('已收藏');
  }
  syncFavButtons();
  if (location.hash.startsWith('#favorites')) render();
}

const ACTIONS = {
  'open-login': el => openAuth('login', el.dataset.note),
  'open-register': () => openAuth('register'),
  'auth-tab': el => switchAuthTab(el.dataset.tab),
  'close-dialog': el => el.closest('dialog').close(),

  'toggle-menu': el => {
    const open = $('#userMenu').classList.toggle('open');
    el.setAttribute('aria-expanded', open);
  },
  'open-password': () => {
    $('#userMenu').classList.remove('open');
    $('#passwordForm').reset();
    $('#passwordForm .form-error').textContent = '';
    $('#passwordDialog').showModal();
  },
  'logout': async () => {
    await Auth.logout();
    await loadFavs();
    renderUserArea();
    toast('已退出登录');
    render();
  },

  'fav': el => toggleFav(el),

  'write': el => {
    state.pendingDraft = { zone: el.dataset.zone, about: el.dataset.about };
    go('#journal/write');
  },
  'delete-post': async el => {
    const post = await DB.get('posts', Number(el.dataset.id));
    if (!post || post.author !== Auth.user) return;
    if (!confirm(`删除“${post.title}”吗？删除后不能恢复。`)) return;
    await DB.delete('posts', post.id);
    toast('心得已删除');
    go(`${Z(post.zone).href}/notes`);
  },
  'delete-note': async el => {
    if (!confirm('删除这条随手记吗？')) return;
    await DB.delete('notes', Number(el.dataset.id));
    toast('随手记已删除');
    render();
  },
  'delete-media': async el => {
    if (!confirm('删除这个文件吗？插入过它的心得里也会看不到它。')) return;
    const id = Number(el.dataset.id);
    await DB.delete('media', id);
    forgetMedia(id);
    toast('文件已删除');
    render();
  },
  'lightbox': async el => {
    const info = await mediaInfo(Number(el.dataset.id));
    if (!info) return;
    $('#lightboxImg').src = info.url;
    $('#lightboxImg').alt = info.name;
    $('#lightboxCaption').textContent = info.name;
    $('#lightbox').showModal();
  },
  'pick-media': el => {
    const info = mediaCache.get(Number(el.dataset.id));
    $('#pickerDialog').close();
    if (info && state.pickerTarget) insertMediaRef(state.pickerTarget, info);
  },
  'new-section': () => {
    if (!Auth.user) return openAuth('login', '登录后就能新建板块。');
    openSectionDialog();
  },
  'edit-section': async el => openSectionDialog(await DB.get('sections', Number(el.dataset.id))),
  'delete-section': async el => {
    const rec = await DB.get('sections', Number(el.dataset.id));
    if (!rec || rec.owner !== Auth.user) return;
    const key = 's' + rec.id;
    const entries = await DB.getByIndex('entries', 'section', key);
    const posts = await DB.getByIndex('posts', 'zone', key);
    if (!confirm(`删除“${rec.name}”板块吗？板块里的 ${entries.length} 个条目和 ${posts.length} 篇心得会一起删除，不能恢复。`)) return;
    for (const entry of entries) {
      await DB.delete('entries', entry.id);
      await DB.delete('covers', 'e' + entry.id);
      forgetCover('e' + entry.id);
    }
    for (const post of posts) await DB.delete('posts', post.id);
    await DB.delete('sections', rec.id);
    await loadSections();
    toast('板块已删除');
    go('#sections');
  },
  'new-entry': el => openEntryDialog(el.dataset.section),
  'edit-entry': async el => {
    const rec = await DB.get('entries', Number(el.dataset.id));
    if (rec) openEntryDialog(rec.section, rec);
  },
  'delete-entry': async el => {
    const rec = await DB.get('entries', Number(el.dataset.id));
    if (!rec || rec.owner !== Auth.user) return;
    if (!confirm(`删除条目“${rec.name}”吗？删除后不能恢复。`)) return;
    await DB.delete('entries', rec.id);
    await DB.delete('covers', 'e' + rec.id);
    forgetCover('e' + rec.id);
    toast('条目已删除');
    go(`${Z(rec.section).href}/intro`);
  },
  'change-cover': el => {
    state.coverFor = el.dataset.id;
    $('#coverInput').click();
  },
  'reset-cover': async el => {
    await DB.delete('covers', el.dataset.id);
    forgetCover(el.dataset.id);
    toast('已恢复默认图片');
    render();
  },
};

document.addEventListener('click', async e => {
  // 点到用户菜单外面时收起菜单
  if (!e.target.closest('.user')) $('#userMenu')?.classList.remove('open');

  const el = e.target.closest('[data-action]');
  if (!el || !ACTIONS[el.dataset.action]) return;
  e.preventDefault();
  try {
    await ACTIONS[el.dataset.action](el, e);
  } catch (err) {
    console.error(err);
    toast(`操作没有完成：${err.message}`);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#userMenu')?.classList.remove('open');
});

/* =================================================================
 * 12. 启动
 * ================================================================= */
async function init() {
  if (!('indexedDB' in window)) {
    $('#view').innerHTML = `<div class="wrap page">${emptyHTML('这个浏览器不支持 IndexedDB。请换用最新版的 Chrome、Edge、Firefox 或 Safari 打开。')}</div>`;
    return;
  }
  try {
    await DB.open();
    await seedIfEmpty();
    await loadSections();
    await Auth.restore();
    await loadFavs();
  } catch (err) {
    console.error(err);
    $('#view').innerHTML = `<div class="wrap page">${emptyHTML('数据库打不开。如果开着无痕或隐私模式，请换成普通窗口再试。')}</div>`;
    return;
  }

  renderUserArea();
  bindAccountForms();
  bindSectionForms();

  // 搜索框
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('#searchInput').value.trim();
    if (q) go('#search/' + encodeURIComponent(q));
  });

  // 更换卡片封面
  $('#coverInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file || !state.coverFor) return;
    if (!file.type.startsWith('image/')) { toast('请选择一张图片'); return; }
    await DB.put('covers', { itemId: state.coverFor, blob: file, by: Auth.user, updatedAt: Date.now() });
    forgetCover(state.coverFor);
    toast('图片已更换');
    render();
  });

  // 插入媒体弹窗里的"上传并插入"
  $('#pickerUpload').addEventListener('change', async e => {
    const ids = await uploadFiles(e.target.files);
    e.target.value = '';
    if (!ids.length) return;
    $('#pickerDialog').close();
    for (const id of ids) insertMediaRef(state.pickerTarget, await mediaInfo(id));
  });

  window.addEventListener('hashchange', render);
  render();
}

init();
</script>
</body>
</html>
