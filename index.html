<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两个半场</title>
<!--
  两个半场：有关个人生活经历的网页
  ------------------------------------------------------------
  整个网站就是这一个 HTML 文件，用浏览器直接打开即可。
  文件分三部分：
    1. <style>   页面样式（颜色、字体、布局）
    2. <body>    固定不变的页面骨架：顶栏、主体区域、页脚、几个弹窗
    3. <script>  所有功能：IndexedDB 数据库、账号系统、页面切换、自建板块、
                 心得编辑器（Markdown）、随手记、媒体上传、收藏、搜索
  所有数据都保存在浏览器的 IndexedDB 里，不需要服务器。
  演示账号：demo，密码：123456（第一次打开时自动创建）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. 设计变量：颜色、字体、圆角
   想换配色，只需要改这里
   ========================================================= */
:root {
  --chalk: #F1F4EF;       /* 粉笔白：页面底色 */
  --paper: #FFFFFF;       /* 纸白：卡片、输入框 */
  --turf: #D9E3D3;        /* 浅草色：边框、分隔线 */
  --turf-soft: #E8EEE4;   /* 更浅的草色：标签底色 */
  --pitch: #22573A;       /* 场地绿：体育分区、主按钮 */
  --pitch-deep: #173F2A;
  --pixel: #2F5FD0;       /* 像素蓝：游戏分区 */
  --pixel-deep: #1F3F8C;
  --score: #F2B705;       /* 记分牌黄：收藏、强调 */
  --ink: #16201B;         /* 墨色：正文 */
  --muted: #56655C;       /* 次要文字 */
  --danger: #B3261E;      /* 删除、错误 */
  --focus: #2F5FD0;       /* 键盘焦点框 */

  --font-display: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-code: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans SC", monospace;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 18px;
  --wrap: 1180px;
}

/* =========================================================
   2. 基础样式
   ========================================================= */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--chalk);
  color: var(--ink);
  font: 16px/1.75 var(--font-body);
}
img, video { max-width: 100%; display: block; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.3; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: var(--r-sm); }
.skip:focus { top: 12px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 18px;
  border: 1px solid var(--turf); border-radius: 8px;
  background: var(--paper); font-weight: 500;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--pitch); border-color: var(--pitch); color: var(--paper); }
.btn.primary:hover { background: var(--pitch-deep); border-color: var(--pitch-deep); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { border-color: var(--turf); }
.btn.small { height: 32px; padding: 0 12px; font-size: 14px; }

/* 收藏按钮：空心星 / 实心星 */
.fav {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border: 1px solid var(--turf); border-radius: 999px;
  background: var(--paper); font-size: 14px; cursor: pointer; white-space: nowrap;
}
.fav:hover { border-color: var(--ink); }
.fav .star::before { content: "☆"; }
.fav[aria-pressed="true"] { background: var(--score); border-color: var(--score); font-weight: 700; }
.fav[aria-pressed="true"] .star::before { content: "★"; }

/* 标签小圆角 */
.tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.tags li { font-size: 13px; padding: 1px 10px; border-radius: 999px; background: var(--turf-soft); color: var(--muted); }

/* 空状态 */
.empty { padding: 40px 24px; border: 2px dashed var(--turf); border-radius: var(--r-md); text-align: center; color: var(--muted); }
.empty p { margin: 0 0 16px; }
.empty p:last-child { margin-bottom: 0; }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* =========================================================
   3. 顶栏
   ========================================================= */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--turf); }
.topbar-inner { display: flex; align-items: center; gap: 20px; height: 64px; }
.brand { font-family: var(--font-display); font-size: 30px; line-height: 1; text-decoration: none; white-space: nowrap; }
.brand .a { color: var(--pixel); }
.brand .b { color: var(--pitch); }
.mainnav { display: flex; gap: 4px; }
.mainnav a { padding: 6px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
.mainnav a:hover { color: var(--ink); background: var(--turf-soft); }
.mainnav a[aria-current="page"] { color: var(--paper); background: var(--ink); }
.search { margin-left: auto; }
.search input { width: 220px; height: 38px; padding: 0 16px; border: 1px solid var(--turf); border-radius: 999px; background: var(--chalk); }

/* 登录后的用户菜单 */
.user { position: relative; }
.user-btn { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 4px; border: 1px solid var(--turf); border-radius: 999px; background: var(--paper); cursor: pointer; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--pitch); color: var(--paper); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.menu { display: none; position: absolute; right: 0; top: calc(100% + 8px); min-width: 160px; padding: 6px; background: var(--paper); border: 1px solid var(--turf); border-radius: var(--r-md); box-shadow: 0 16px 40px rgba(22, 32, 27, .16); }
.menu.open { display: block; }
.menu button { display: block; width: 100%; padding: 8px 12px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; cursor: pointer; }
.menu button:hover { background: var(--chalk); }

@media (max-width: 1080px) {
  .topbar { position: static; }
  .topbar-inner { flex-wrap: wrap; height: auto; padding-top: 12px; padding-bottom: 12px; gap: 12px; }
  #userArea { order: 1; margin-left: auto; }
  .mainnav { order: 2; width: 100%; overflow-x: auto; }
  .search { order: 3; width: 100%; margin-left: 0; }
  .search input { width: 100%; }
  .user-name { display: none; }
  .user-btn { padding-right: 4px; }
}

/* =========================================================
   4. 首页：一块被中线分成两半的球场
   左半场 = 游戏（像素网格），右半场 = 体育（草坪条纹）
   ========================================================= */
.hero { padding: 40px 0 56px; }
.hero-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; margin-bottom: 24px; }
.hero-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(60px, 9vw, 112px); line-height: .95; }
.hero-title .a { color: var(--pixel); }
.hero-title .b { color: var(--pitch); }
.hero-sub { max-width: 26em; margin: 0; color: var(--muted); font-size: 17px; }

.pitch { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: clamp(380px, 58vh, 520px); border-radius: var(--r-lg); overflow: hidden; }
.pitch::after { /* 中线 */
  content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px;
  background: var(--chalk); pointer-events: none;
}
.half {
  position: relative; isolation: isolate;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 40px; color: var(--paper); text-decoration: none;
}
.half:hover { filter: brightness(1.06); }
.half:focus-visible { outline: 4px solid var(--score); outline-offset: -4px; border-radius: 0; }
.half-word { font-family: var(--font-display); font-size: clamp(68px, 10vw, 136px); line-height: 1; }
.half-text { margin-top: 10px; max-width: 20em; font-size: 17px; }
.half-go { align-self: flex-start; margin-top: 20px; padding: 8px 18px; border-radius: 999px; background: var(--paper); color: var(--ink); font-weight: 700; transition: background .2s; }
.half:hover .half-go { background: var(--score); }

.half-game {
  background-color: var(--pixel);
  background-image:
    linear-gradient(rgba(255, 255, 255, .09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .09) 1px, transparent 1px);
  background-size: 24px 24px;
}
.half-game::before { /* 用像素格子拼出的手柄方向键和两个按键 */
  content: ""; position: absolute; z-index: -1;
  left: 72px; top: 48px; width: 24px; height: 24px;
  background: rgba(255, 255, 255, .3);
  box-shadow:
    -24px 24px 0 rgba(255, 255, 255, .3),
    0 24px 0 rgba(255, 255, 255, .18),
    24px 24px 0 rgba(255, 255, 255, .3),
    0 48px 0 rgba(255, 255, 255, .3),
    120px 24px 0 var(--score),
    168px 0 0 rgba(255, 255, 255, .55);
}
.half-sport {
  background: repeating-linear-gradient(90deg, var(--pitch) 0 60px, #265F40 60px 120px);
  padding-left: calc(clamp(120px, 18vw, 210px) / 2 + 32px); /* 让文字避开中圈 */
}
.half-sport::before, .half-sport::after { /* 禁区和小禁区 */
  content: ""; position: absolute; z-index: -1; right: 0;
  border: 3px solid var(--chalk); border-right: 0;
}
.half-sport::before { top: 22%; height: 56%; width: 16%; }
.half-sport::after { top: 38%; height: 24%; width: 6%; }

.center-circle { position: absolute; z-index: 2; left: 50%; top: 50%; width: clamp(120px, 18vw, 210px); transform: translate(-50%, -50%); pointer-events: none; }
.center-circle circle { fill: none; stroke: var(--chalk); stroke-width: 1.5; }
.center-circle .ring { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw-ring 1.2s .3s ease-out forwards; }
.center-circle .dot { fill: var(--chalk); stroke: none; }
@keyframes draw-ring { to { stroke-dashoffset: 0; } }

@media (max-width: 720px) {
  .pitch { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; min-height: 580px; }
  .pitch::after { left: 0; right: 0; top: 50%; bottom: auto; width: auto; height: 3px; margin: -1.5px 0 0; }
  .half, .half-sport { padding: 24px; }
  .half-game { justify-content: flex-start; }
  .half-game::before { display: none; }
  .half-sport::before, .half-sport::after { right: auto; top: auto; bottom: 0; border: 3px solid var(--chalk); border-bottom: 0; }
  .half-sport::before { left: 22%; width: 56%; height: 16%; }
  .half-sport::after { left: 38%; width: 24%; height: 7%; }
  .half-sport .half-word, .half-sport .half-text, .half-sport .half-go { margin-bottom: 0; }
  .half-sport { justify-content: flex-start; padding-top: 64px; }
}

/* 首页下方：最近的心得 + 侧栏 */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 48px; padding-bottom: 72px; }
.section-title { margin: 0 0 16px; font-size: 24px; }
.card { margin-bottom: 20px; padding: 24px; background: var(--paper); border: 1px solid var(--turf); border-radius: var(--r-md); }
.card h2 { margin: 0 0 8px; font-size: 20px; }
.card p { margin: 0 0 12px; }
.card .actions { margin: 16px 0 12px; }
.card-login { border-top: 5px solid var(--score); }
.quick { list-style: none; margin: 12px 0 0; padding: 0; }
.quick a { display: block; padding: 10px 0; border-top: 1px solid var(--turf-soft); text-decoration: none; font-weight: 500; }
.quick a:hover { color: var(--pitch); }
.more { margin-top: 16px; color: var(--muted); }
@media (max-width: 860px) { .home-grid { grid-template-columns: 1fr; gap: 24px; } }

/* =========================================================
   5. 栏目页顶部色带 + 子标签
   子标签做成"文件夹标签"，选中的那个和下面的内容连在一起
   ========================================================= */
.band { position: relative; padding-top: 48px; color: var(--paper); }
.band.no-tabs { padding-bottom: 40px; }
.band-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(44px, 6vw, 64px); line-height: 1.05; }
.band-lead { max-width: 36em; margin: 12px 0 28px; font-size: 17px; opacity: .92; }
.band.no-tabs .band-lead { margin-bottom: 0; }
.subtabs { display: flex; gap: 6px; overflow-x: auto; }
.subtabs a { padding: 10px 22px; border-radius: 10px 10px 0 0; color: inherit; text-decoration: none; font-weight: 500; white-space: nowrap; opacity: .85; }
.subtabs a:hover { opacity: 1; background: rgba(255, 255, 255, .14); }
.subtabs a[aria-current="page"] { opacity: 1; background: var(--chalk); color: var(--ink); }
.subtabs a:focus-visible { outline-offset: -3px; }

.band-game {
  background-color: var(--pixel);
  background-image:
    linear-gradient(rgba(255, 255, 255, .08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .08) 1px, transparent 1px);
  background-size: 24px 24px;
}
.band-sport { background: repeating-linear-gradient(90deg, var(--pitch) 0 60px, #265F40 60px 120px); }
.band-journal { /* 记分本：横线纸 */
  color: var(--ink);
  background: var(--paper) repeating-linear-gradient(transparent 0 31px, var(--turf-soft) 31px 32px);
  border-bottom: 1px solid var(--turf);
}
.band-journal .subtabs a:hover { background: rgba(22, 32, 27, .06); }
.band-fav { background: var(--score); color: var(--ink); }
.band-fav .subtabs a:hover { background: rgba(22, 32, 27, .08); }
.band-search { background: var(--ink); }
.band-game :focus-visible, .band-sport :focus-visible, .band-search :focus-visible { outline-color: var(--paper); }

.page { padding-top: 32px; padding-bottom: 72px; }
.list-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-bottom: 20px; }
.list-head p { margin: 0; }

/* =========================================================
   6. 游戏/运动卡片 与 详情页
   ========================================================= */
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }
.item-card { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--turf); border-radius: var(--r-md); overflow: hidden; }
.cover { display: grid; place-items: center; aspect-ratio: 16 / 10; overflow: hidden; background: var(--c, var(--pitch)); }
.cover svg { width: 62%; height: auto; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.item-body { display: flex; flex-direction: column; gap: 6px; flex: 1; padding: 18px 20px 20px; }
.item-body h3 { margin: 0; font-size: 21px; }
.item-body h3 a { text-decoration: none; }
.item-body h3 a:hover { text-decoration: underline; }
.item-kind { margin: 0; color: var(--muted); font-size: 14px; }
.item-intro { flex: 1; margin: 0; }
.item-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }

.back { display: inline-block; margin: 28px 0 20px; color: var(--muted); text-decoration: none; }
.back::before { content: "‹ "; }
.back:hover { color: var(--ink); text-decoration: underline; }
.detail { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.detail .cover { aspect-ratio: 4 / 3; border-radius: var(--r-md); }
.detail h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(48px, 6vw, 76px); line-height: 1.05; }
.detail-kind { margin: 6px 0 14px; color: var(--muted); }
.detail .lead { margin: 18px 0 12px; font-size: 19px; font-weight: 500; }
.story p { max-width: 34em; margin: 0 0 1em; white-space: pre-line; }
.detail h1 + .tags { margin-top: 14px; }
.detail .actions { margin-top: 20px; }
.related { margin-top: 56px; padding-bottom: 72px; }
@media (max-width: 820px) { .detail { grid-template-columns: 1fr; gap: 24px; } }

/* =========================================================
   7. 心得列表 与 文章页
   左边的色条表示分类：蓝 = 游戏，绿 = 体育
   ========================================================= */
.z-game { --zc: var(--pixel); }
.z-sport { --zc: var(--pitch); }
.z-life { --zc: var(--score); }

.post-list { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0; }
.post-row {
  position: relative; display: flex; align-items: flex-start; gap: 16px;
  padding: 18px 20px; background: var(--paper);
  border: 1px solid var(--turf); border-left: 5px solid var(--zc); border-radius: var(--r-sm);
}
.post-row:hover { border-color: var(--zc); }
.post-main { flex: 1; min-width: 0; }
.post-row h3 { margin: 0; font-size: 19px; }
.post-row h3 a { text-decoration: none; }
.post-row h3 a::after { content: ""; position: absolute; inset: 0; } /* 整行都可点击 */
.post-meta { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.post-excerpt { margin: 6px 0 0; color: #33413A; }
.post-row .fav { position: relative; z-index: 1; }

.article { max-width: 760px; margin: 0 auto; }
.zone-tag { display: inline-block; padding: 1px 12px; border-radius: 999px; background: var(--zc); color: var(--paper); font-size: 13px; }
.article h1 { margin: 10px 0 6px; font-size: clamp(30px, 4vw, 40px); }
.article-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 32px; color: var(--muted); font-size: 14px; }
.article-actions { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--turf); }

/* Markdown 渲染后的正文 */
.md-body { line-height: 1.85; overflow-wrap: anywhere; }
.md-body > :first-child { margin-top: 0; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 { margin: 1.6em 0 .6em; line-height: 1.35; }
.md-body h1 { font-size: 28px; }
.md-body h2 { font-size: 23px; }
.md-body h3 { font-size: 19px; }
.md-body h4, .md-body h5, .md-body h6 { font-size: 16px; }
.md-body p, .md-body ul, .md-body ol, .md-body blockquote, .md-body pre, .md-body .table-wrap { margin: 0 0 1em; }
.md-body ul, .md-body ol { padding-left: 1.5em; }
.md-body li.task { list-style: none; margin-left: -1.5em; }
.md-body li.task input { margin-right: 6px; }
.md-body blockquote { padding: 10px 16px; border-left: 4px solid var(--score); border-radius: 0 6px 6px 0; background: #FFF7DA; color: #3B3520; }
.md-body blockquote > :last-child { margin-bottom: 0; }
.md-body code { padding: 2px 6px; border-radius: 4px; background: var(--turf-soft); font-family: var(--font-code); font-size: .9em; }
.md-body pre { padding: 16px 18px; border-radius: 8px; background: var(--ink); color: #E8EEE4; overflow-x: auto; line-height: 1.6; }
.md-body pre code { padding: 0; background: none; color: inherit; }
.md-body hr { margin: 2em 0; border: 0; border-top: 2px dashed var(--turf); }
.md-body a { color: var(--pixel); }
.md-body .table-wrap { overflow-x: auto; }
.md-body table { min-width: 50%; border-collapse: collapse; }
.md-body th, .md-body td { padding: 6px 14px; border: 1px solid var(--turf); }
.md-body th { background: var(--turf-soft); }
.md-body img, .md-body video { max-height: 520px; margin: 8px 0; border-radius: 8px; }
.md-body audio { width: 100%; margin: 8px 0; }
.md-media { display: block; }
.md-media.missing { display: inline-block; padding: 6px 12px; border: 1px dashed var(--turf); border-radius: 6px; color: var(--muted); font-size: 14px; }

/* =========================================================
   8. 心得编辑器
   ========================================================= */
.editor { background: var(--paper); border: 1px solid var(--turf); border-radius: var(--r-md); overflow: hidden; }
.editor-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px 20px; border-bottom: 1px solid var(--turf); }
.title-input { flex: 1; min-width: 220px; padding: 4px 0; border: 0; background: transparent; font-size: 24px; font-weight: 700; }
.title-input:focus-visible { outline: none; box-shadow: 0 2px 0 var(--focus); border-radius: 0; }

/* 分段选择器（单选按钮做成的开关） */
.seg { display: inline-flex; gap: 2px; margin: 0; padding: 3px; border: 1px solid var(--turf); border-radius: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; padding: 4px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; }
.seg input:checked + span { background: var(--ink); color: var(--paper); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); }

.toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--turf); background: var(--chalk); }
.toolbar button { height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; font-size: 14px; cursor: pointer; }
.toolbar button:hover { background: var(--paper); border-color: var(--turf); }
.toolbar .b { font-weight: 700; }
.toolbar .i { font-style: italic; }
.toolbar .s { text-decoration: line-through; }
.toolbar .sep { width: 1px; margin: 4px 6px; background: var(--turf); }
.toolbar .media { margin-left: auto; background: var(--score); font-weight: 700; }
.toolbar .media:hover { background: var(--score); border-color: var(--ink); }

.editor-switch { display: none; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--turf); }
.editor-switch button { padding: 4px 16px; border: 1px solid var(--turf); border-radius: 999px; background: var(--paper); cursor: pointer; }
.editor-switch button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.panes { display: grid; grid-template-columns: 1fr 1fr; }
.edit-pane { display: block; border-right: 1px solid var(--turf); }
.edit-pane textarea { display: block; width: 100%; min-height: 520px; height: 100%; padding: 20px; border: 0; resize: vertical; background: var(--paper); font-family: var(--font-code); font-size: 15px; line-height: 1.75; }
.edit-pane textarea:focus-visible { outline-offset: -3px; }
.preview { max-height: 72vh; padding: 20px 24px; overflow: auto; }
.editor-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--turf); }
.editor-foot .count { margin-right: auto; color: var(--muted); font-size: 14px; }
@media (max-width: 820px) {
  .editor-switch { display: flex; }
  .panes { grid-template-columns: 1fr; }
  .edit-pane { border-right: 0; }
  .edit-pane textarea { min-height: 380px; }
  .preview { max-height: none; min-height: 380px; }
  .panes[data-show="edit"] .preview { display: none; }
  .panes[data-show="preview"] .edit-pane { display: none; }
  .toolbar .media { margin-left: 0; }
}

/* =========================================================
   9. 随手记（时间线）
   ========================================================= */
.composer { margin-bottom: 32px; padding: 16px; background: var(--paper); border: 1px solid var(--turf); border-radius: var(--r-md); }
.composer textarea { display: block; width: 100%; min-height: 88px; padding: 4px; border: 0; resize: vertical; background: transparent; font-size: 17px; line-height: 1.7; }
.composer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--turf-soft); }
.composer-row .hint { margin-left: auto; }
.day { margin: 28px 0 10px; color: var(--muted); font-size: 15px; }
.notes { list-style: none; margin: 0 0 0 6px; padding: 0; border-left: 2px solid var(--turf); }
.note { position: relative; padding: 2px 0 20px 24px; }
.note::before { content: ""; position: absolute; left: -8px; top: 9px; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 3px solid var(--zc); }
.note-head { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.note-head .btn { margin-left: auto; }
.chip { padding: 0 10px; border-radius: 999px; background: var(--zc); color: var(--paper); font-size: 13px; }
.z-life .chip { color: var(--ink); }
.note-text { max-width: 40em; margin: 4px 0 0; white-space: pre-wrap; }

/* =========================================================
   10. 媒体库
   ========================================================= */
.dropzone {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 40px 24px; text-align: center; cursor: pointer;
  background: var(--paper); border: 2px dashed var(--pitch); border-radius: var(--r-md);
  transition: background .15s;
}
.dropzone:hover, .dropzone.is-over { background: #E6F0E2; }
.dropzone.is-over { border-style: solid; }
.dropzone:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.dropzone strong { font-size: 19px; }
.dropzone span { color: var(--muted); font-size: 14px; }

.media-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 28px 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips a { padding: 4px 14px; border: 1px solid var(--turf); border-radius: 999px; background: var(--paper); font-size: 14px; text-decoration: none; }
.chips a:hover { border-color: var(--ink); }
.chips a[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.usage { margin-left: auto; color: var(--muted); font-size: 13px; }

.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; list-style: none; margin: 0; padding: 0; }
.tile { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--turf); border-radius: var(--r-md); overflow: hidden; }
.tile-face { width: 100%; aspect-ratio: 4 / 3; }
.tile-view { display: block; padding: 0; border: 0; background: var(--ink); cursor: zoom-in; }
.tile-view img { width: 100%; height: 100%; object-fit: cover; }
.tile-view:focus-visible { outline-offset: -3px; }
video.tile-face { background: #000; object-fit: contain; }
.audio-face { display: grid; place-items: center; background: repeating-linear-gradient(90deg, var(--pitch) 0 24px, #265F40 24px 48px); color: var(--paper); font-family: var(--font-display); font-size: 44px; }
.tile audio { width: 100%; height: 40px; }
.tile-info { display: flex; flex-direction: column; flex: 1; padding: 12px 14px 14px; }
.tile-name { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.tile-meta { margin: 0; color: var(--muted); font-size: 13px; }
.tile-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }

/* =========================================================
   11. 收藏页、搜索结果、需要登录的提示
   ========================================================= */
.fav-list, .result-list { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0; }
.fav-row, .result {
  display: flex; align-items: center; gap: 16px; padding: 14px 18px;
  background: var(--paper); border: 1px solid var(--turf); border-left: 5px solid var(--zc, var(--turf)); border-radius: var(--r-sm);
}
.z-media { --zc: var(--ink); }
.fav-thumb { flex: none; width: 64px; height: 48px; border-radius: 4px; object-fit: cover; }
.fav-main, .result-main { flex: 1; min-width: 0; }
.fav-main a, .result-main a { font-weight: 700; font-size: 17px; text-decoration: none; }
.fav-main a:hover, .result-main a:hover { text-decoration: underline; }
.fav-main p, .result-main p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.fav-row.missing { opacity: .7; }
.result-group { margin-bottom: 40px; }
.result-group h2 { margin: 0 0 14px; font-size: 20px; }
.result-group h2 small { margin-left: 8px; color: var(--muted); font-weight: 400; font-size: 15px; }
mark { padding: 0 2px; border-radius: 2px; background: #FFE38A; color: inherit; }

.gate { max-width: 520px; margin: 32px auto 0; padding: 40px 32px; text-align: center; background: var(--paper); border: 1px solid var(--turf); border-radius: var(--r-md); }
.gate h2 { margin: 0 0 8px; }
.gate p { margin: 0 0 20px; }
.gate .actions { justify-content: center; margin-bottom: 16px; }

/* =========================================================
   11b. 自建板块：板块方块、板块色带、新建板块和条目的表单
   ========================================================= */
.band-custom { /* 自建板块的色带，颜色由用户选择，带点状底纹 */
  background-color: var(--band);
  background-image: radial-gradient(rgba(255, 255, 255, .16) 1.5px, transparent 1.6px);
  background-size: 20px 20px;
}
.band-ink { background: var(--ink); }
.band-custom :focus-visible, .band-ink :focus-visible { outline-color: var(--paper); }
.band-owner { margin: -16px 0 24px; font-size: 14px; opacity: .85; }
.cover-letter { font-family: var(--font-display); font-size: clamp(64px, 8vw, 96px); line-height: 1; color: var(--chalk); }

.section-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; list-style: none; margin: 0; padding: 0; }
.section-tile {
  display: flex; flex-direction: column; gap: 6px; width: 100%; height: 100%; min-height: 190px; padding: 24px;
  border: 0; border-radius: var(--r-md); background: var(--c); color: var(--paper);
  text-align: left; text-decoration: none; cursor: pointer;
}
.section-tile:hover { filter: brightness(1.08); }
.section-name { font-family: var(--font-display); font-size: 44px; line-height: 1.05; }
.section-lead { flex: 1; font-size: 15px; opacity: .92; }
.section-count { font-size: 14px; opacity: .85; }
.section-new { background: var(--paper); color: var(--ink); border: 2px dashed var(--turf); }
.section-new:hover { filter: none; border-color: var(--pitch); }
.section-new .section-name { color: var(--pitch); }
.section-grid.compact .section-tile { min-height: 130px; padding: 20px; }
.section-grid.compact .section-name { font-size: 34px; }
.more-sections { margin-top: 40px; }
.more-sections .list-head h2 { margin: 0; }

.swatches { margin: 0 0 14px; padding: 0; border: 0; }
.swatches legend { margin-bottom: 8px; padding: 0; font-size: 14px; font-weight: 500; }
.swatch-row { display: flex; flex-wrap: wrap; gap: 12px; }
.swatch { position: relative; }
.swatch input { position: absolute; opacity: 0; }
.swatch .dot { display: block; width: 36px; height: 36px; border-radius: 50%; background: var(--c); cursor: pointer; }
.swatch input:checked + .dot { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
.swatch input:focus-visible + .dot { outline: 3px solid var(--focus); outline-offset: 5px; }
.field textarea { min-height: 110px; padding: 10px 14px; border: 1px solid var(--turf); border-radius: 8px; background: var(--chalk); resize: vertical; line-height: 1.7; }
.field input[type="file"] { height: auto; padding: 8px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
.zone-select select { height: 36px; padding: 0 12px; border: 1px solid var(--turf); border-radius: 8px; background: var(--paper); font-size: 14px; }

/* =========================================================
   12. 弹窗、提示条、页脚
   ========================================================= */
dialog { width: min(440px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: var(--r-lg); background: var(--paper); color: var(--ink); box-shadow: 0 30px 80px rgba(10, 30, 20, .35); }
dialog { max-height: calc(100vh - 32px); overflow: auto; }
dialog::backdrop { background: rgba(22, 32, 27, .55); }
dialog.wide { width: min(760px, calc(100vw - 32px)); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px 0; }
.dlg-head h2 { margin: 0; font-size: 20px; }
.dlg-note { margin: 8px 24px 0; padding: 8px 12px; border-radius: var(--r-sm); background: #FFF7DA; font-size: 14px; }
.dlg-body { padding: 16px 24px 24px; }
.auth-tabs { display: flex; gap: 20px; margin: 12px 24px 0; border-bottom: 1px solid var(--turf); }
.auth-tabs button { padding: 8px 0; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); font-weight: 500; cursor: pointer; }
.auth-tabs button[aria-selected="true"] { border-bottom-color: var(--pitch); color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field span { font-size: 14px; font-weight: 500; }
.field input { height: 44px; padding: 0 14px; border: 1px solid var(--turf); border-radius: 8px; background: var(--chalk); }
.form-error { min-height: 1.5em; margin: 0 0 10px; color: var(--danger); font-size: 14px; }
.dlg-body .btn.primary { width: 100%; height: 44px; }
.dlg-body .hint { margin: 12px 0 0; }

.picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; max-height: 56vh; margin-top: 16px; overflow: auto; }
.pick { display: flex; flex-direction: column; padding: 0; border: 1px solid var(--turf); border-radius: var(--r-sm); background: var(--paper); overflow: hidden; cursor: pointer; text-align: left; }
.pick:hover { border-color: var(--ink); }
.pick img, .pick-type { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.pick-type { display: grid; place-items: center; background: var(--pitch); color: var(--paper); font-family: var(--font-display); font-size: 28px; }
.pick-name { padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }

.lightbox { width: min(1000px, calc(100vw - 32px)); background: var(--ink); color: var(--paper); }
.lightbox img { max-height: 76vh; margin: 0 auto; object-fit: contain; }
.lightbox .dlg-head { padding: 12px 16px; }
.lightbox .dlg-head p { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lightbox .btn { background: transparent; color: var(--paper); border-color: rgba(255, 255, 255, .3); }

#toast { position: fixed; z-index: 100; left: 50%; bottom: 24px; max-width: calc(100vw - 32px); padding: 10px 22px; border-radius: 999px; background: var(--ink); color: var(--paper); opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.site-foot { padding: 28px 0 40px; border-top: 1px solid var(--turf); color: var(--muted); font-size: 14px; }
.site-foot p { margin: 0 0 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .center-circle .ring { stroke-dashoffset: 0; }
}
</style>
</head>

<body>
<a class="skip" href="#view">跳到正文</a>

<!-- ============ 顶栏：站名、主导航、搜索、登录 ============ -->
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#home" aria-label="两个半场首页"><span class="a">两个</span><span class="b">半场</span></a>
    <nav class="mainnav" aria-label="主导航">
      <a href="#home" data-nav="home">首页</a>
      <a href="#games" data-nav="games">游戏分区</a>
      <a href="#sports" data-nav="sports">体育分区</a>
      <a href="#sections" data-nav="sections">全部板块</a>
      <a href="#journal" data-nav="journal">我的记录</a>
      <a href="#favorites" data-nav="favorites">收藏</a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="搜索游戏、运动、心得" aria-label="搜索">
    </form>
    <div id="userArea"></div>
  </div>
</header>

<!-- ============ 主体：每个页面的内容由 JavaScript 填进来 ============ -->
<main id="view" tabindex="-1"></main>

<footer class="site-foot">
  <div class="wrap">
    <p>两个半场，王建忠的个人生活记录。实用软件实践课程设计，2026 年。</p>
    <p>账号、心得和媒体文件都保存在本机浏览器的 IndexedDB 里，清除浏览器数据会一起删除。</p>
  </div>
</footer>

<!-- ============ 弹窗：登录 / 注册 ============ -->
<dialog id="authDialog" aria-labelledby="authTitle">
  <div class="dlg-head">
    <h2 id="authTitle">欢迎来到两个半场</h2>
    <button type="button" class="btn ghost small" data-action="close-dialog">关闭</button>
  </div>
  <p class="dlg-note" id="authNote" hidden></p>
  <div class="auth-tabs" role="tablist">
    <button type="button" role="tab" id="tabLogin" aria-controls="loginForm" data-action="auth-tab" data-tab="login" aria-selected="true">登录</button>
    <button type="button" role="tab" id="tabRegister" aria-controls="registerForm" data-action="auth-tab" data-tab="register" aria-selected="false">注册</button>
  </div>
  <form class="dlg-body" id="loginForm" role="tabpanel" aria-labelledby="tabLogin">
    <label class="field"><span>用户名</span><input name="username" autocomplete="username" required></label>
    <label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required></label>
    <p class="form-error" role="alert"></p>
    <button class="btn primary" type="submit">登录</button>
    <p class="hint">想先看看效果，可以用演示账号 demo，密码 123456。</p>
  </form>
  <form class="dlg-body" id="registerForm" role="tabpanel" aria-labelledby="tabRegister" hidden>
    <label class="field"><span>用户名</span><input name="username" autocomplete="username" required></label>
    <label class="field"><span>密码</span><input name="password" type="password" autocomplete="new-password" required></label>
    <label class="field"><span>再输入一次密码</span><input name="confirm" type="password" autocomplete="new-password" required></label>
    <p class="form-error" role="alert"></p>
    <button class="btn primary" type="submit">注册并登录</button>
    <p class="hint">用户名 2 到 16 个字符，可以用中文、字母、数字和下划线。密码至少 6 位。</p>
  </form>
</dialog>

<!-- ============ 弹窗：修改密码 ============ -->
<dialog id="passwordDialog" aria-labelledby="pwdTitle">
  <div class="dlg-head">
    <h2 id="pwdTitle">修改密码</h2>
    <button type="button" class="btn ghost small" data-action="close-dialog">关闭</button>
  </div>
  <form class="dlg-body" id="passwordForm">
    <label class="field"><span>现在的密码</span><input name="old" type="password" autocomplete="current-password" required></label>
    <label class="field"><span>新密码</span><input name="password" type="password" autocomplete="new-password" required></label>
    <label class="field"><span>再输入一次新密码</span><input name="confirm" type="password" autocomplete="new-password" required></label>
    <p class="form-error" role="alert"></p>
    <button class="btn primary" type="submit">修改密码</button>
  </form>
</dialog>

<!-- ============ 弹窗：在心得里插入媒体 ============ -->
<dialog id="pickerDialog" class="wide" aria-labelledby="pickerTitle">
  <div class="dlg-head">
    <h2 id="pickerTitle">插入图片、视频或音频</h2>
    <button type="button" class="btn ghost small" data-action="close-dialog">关闭</button>
  </div>
  <div class="dlg-body">
    <label class="btn small">上传并插入新文件<input type="file" id="pickerUpload" class="sr" multiple accept="image/*,video/*,audio/*"></label>
    <p class="hint">从媒体库里选一个文件。插入后，看这篇心得的人都能看到它。</p>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</dialog>

<!-- ============ 弹窗：看大图 ============ -->
<dialog id="lightbox" class="lightbox" aria-label="查看图片">
  <div class="dlg-head">
    <p id="lightboxCaption"></p>
    <button type="button" class="btn small" data-action="close-dialog">关闭</button>
  </div>
  <img id="lightboxImg" alt="">
</dialog>

<!-- ============ 弹窗：新建 / 编辑板块 ============ -->
<dialog id="sectionDialog" aria-labelledby="sectionTitle">
  <div class="dlg-head">
    <h2 id="sectionTitle">新建板块</h2>
    <button type="button" class="btn ghost small" data-action="close-dialog">关闭</button>
  </div>
  <form class="dlg-body" id="sectionForm">
    <label class="field"><span>板块名称</span><input name="sectionName" maxlength="8" placeholder="比如：音乐" required></label>
    <label class="field"><span>一句话介绍</span><input name="lead" maxlength="60" placeholder="比如：除了打游戏和运动，我还在学吉他。"></label>
    <label class="field"><span>条目栏的名字</span><input name="itemsLabel" maxlength="8" placeholder="比如：在学的东西，不填就叫“全部条目”"></label>
    <fieldset class="swatches"><legend>颜色</legend><div class="swatch-row" id="swatchRow"></div></fieldset>
    <p class="form-error" role="alert"></p>
    <button class="btn primary" type="submit" id="sectionSubmit">新建板块</button>
  </form>
</dialog>

<!-- ============ 弹窗：在自建板块里添加 / 编辑条目 ============ -->
<dialog id="entryDialog" class="wide" aria-labelledby="entryTitle">
  <div class="dlg-head">
    <h2 id="entryTitle">添加条目</h2>
    <button type="button" class="btn ghost small" data-action="close-dialog">关闭</button>
  </div>
  <form class="dlg-body" id="entryForm">
    <div class="field-row">
      <label class="field"><span>名字</span><input name="entryName" maxlength="20" placeholder="比如：吉他" required></label>
      <label class="field"><span>类型</span><input name="kind" maxlength="12" placeholder="比如：乐器"></label>
    </div>
    <div class="field-row">
      <label class="field"><span>时间</span><input name="since" maxlength="20" placeholder="比如：大一下学期开始"></label>
      <label class="field"><span>标签</span><input name="tags" maxlength="40" placeholder="用逗号或空格分开"></label>
    </div>
    <label class="field"><span>一句话介绍</span><input name="intro" maxlength="80"></label>
    <label class="field"><span>详细经历</span><textarea name="story" maxlength="2000" placeholder="空一行就是新的一段。"></textarea></label>
    <label class="field"><span>图片</span><input name="cover" type="file" accept="image/*"><small class="hint" id="entryCoverHint"></small></label>
    <p class="form-error" role="alert"></p>
    <button class="btn primary" type="submit" id="entrySubmit">添加条目</button>
  </form>
</dialog>

<!-- 更换封面用的隐藏文件选择框 -->
<input type="file" id="coverInput" class="sr" accept="image/*" tabindex="-1" aria-hidden="true">

<!-- 操作提示条，例如"已收藏" -->
<div id="toast" role="status" aria-live="polite"></div>

// 把用户输入的文字转成安全的 HTML，防止有人在标题里写 <script>
function esc(value) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(value ?? '').replace(/[&<>"']/g, ch => map[ch]);
}

const pad = n => String(n).padStart(2, '0');
function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; }
function fmtTime(ts) { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDay(ts) { const d = new Date(ts); return `${d.getMonth() + 1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}`; }
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 ** 2) return Math.round(bytes / 1024) + ' KB';
  if (bytes < 1024 ** 3) return (bytes / 1024 ** 2).toFixed(1) + ' MB';
  return (bytes / 1024 ** 3).toFixed(2) + ' GB';
}

// 连续触发时只执行最后一次（用于实时预览、自动保存草稿）
function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

// 去掉 Markdown 符号，得到纯文字（用于摘要和搜索）
function plainText(md) {
  return md
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/gm, ' ') // 表格分隔行和分割线
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[[ xX]\]/g, ' ')
    .replace(/[#>*_`~|]/g, ' ')
    .replace(/^\s*-+\s*/gm, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
// 截取关键词附近的一段文字
function snippet(text, q, length = 90) {
  const i = q ? text.toLowerCase().indexOf(q.toLowerCase()) : -1;
  const start = Math.max(0, i - 24);
  return (start > 0 ? '…' : '') + text.slice(start, start + length) + (start + length < text.length ? '…' : '');
}
// 把关键词用 <mark> 标出来
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const pattern = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(pattern, 'gi'), m => `<mark>${m}</mark>`);
}

/* =================================================================
 * 2. IndexedDB 数据库
 *    把原生的回调接口包装成 Promise，后面就能用 await 了
 *
 *    数据表（object store）：
 *      users      账号：用户名、盐、密码哈希
 *      meta       杂项：当前登录状态（session）
 *      posts      心得（Markdown），所有人可见
 *      notes      随手记，只有自己可见
 *      media      上传的图片、视频、音频（直接存 Blob）
 *      favorites  收藏
 *      covers     卡片的自定义封面（键是条目 id）
 *      sections   用户自建的板块
 *      entries    自建板块里添加的条目
 * ================================================================= */
const DB = {
  name: 'two-halves',
  version: 2, // 版本 2 新增了 sections 和 entries 两张表
  db: null,

  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.name, this.version);
      // 第一次打开（或版本升级）时建表
      req.onupgradeneeded = event => {
        const db = req.result;
        if (event.oldVersion < 1) {
          db.createObjectStore('users', { keyPath: 'username' });
          db.createObjectStore('meta', { keyPath: 'key' });
          db.createObjectStore('posts', { keyPath: 'id', autoIncrement: true }).createIndex('zone', 'zone');
          db.createObjectStore('notes', { keyPath: 'id', autoIncrement: true }).createIndex('owner', 'owner');
          db.createObjectStore('media', { keyPath: 'id', autoIncrement: true }).createIndex('owner', 'owner');
          const fav = db.createObjectStore('favorites', { keyPath: 'id', autoIncrement: true });
          fav.createIndex('owner', 'owner');
          fav.createIndex('unique', ['owner', 'kind', 'ref'], { unique: true }); // 同一个人不能重复收藏同一项
          db.createObjectStore('covers', { keyPath: 'itemId' });
        }
        if (event.oldVersion < 2) {
          db.createObjectStore('sections', { keyPath: 'id', autoIncrement: true });
          db.createObjectStore('entries', { keyPath: 'id', autoIncrement: true }).createIndex('section', 'section');
        }
      };
      req.onsuccess = () => { this.db = req.result; resolve(this.db); };
      req.onerror = () => reject(req.error);
    });
  },

  // 通用方法：开一个事务，执行 fn，事务完成后返回结果
  run(storeName, mode, fn) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, mode);
      const req = fn(tx.objectStore(storeName));
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  },

  get(store, key)            { return this.run(store, 'readonly', s => s.get(key)); },
  getAll(store)              { return this.run(store, 'readonly', s => s.getAll()); },
  getByIndex(store, i, val)  { return this.run(store, 'readonly', s => s.index(i).getAll(val)); },
  count(store)               { return this.run(store, 'readonly', s => s.count()); },
  add(store, value)          { return this.run(store, 'readwrite', s => s.add(value)); },  // 返回新记录的 id
  put(store, value)          { return this.run(store, 'readwrite', s => s.put(value)); },
  delete(store, key)         { return this.run(store, 'readwrite', s => s.delete(key)); },
  findFav(owner, kind, ref)  { return this.run('favorites', 'readonly', s => s.index('unique').get([owner, kind, String(ref)])); },
};

/* =================================================================
 * 3. 账号系统
 *    密码不直接保存，而是保存"随机盐 + 密码"的 SHA-256 哈希
 * ================================================================= */
const USERNAME_RULE = /^[A-Za-z0-9_一-龥]{2,16}$/;

const Auth = {
  user: null, // 当前登录的用户名，没登录时是 null

  newSalt() {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    return [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
  },

  async hash(password, salt) {
    const data = new TextEncoder().encode(salt + ':' + password);
    if (window.crypto && crypto.subtle) {
      const buffer = await crypto.subtle.digest('SHA-256', data);
      return [...new Uint8Array(buffer)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    // 极少数环境没有 crypto.subtle，退回一个简单哈希（仅用于演示）
    let h = 0x811c9dc5;
    for (const b of data) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
    return 'fnv-' + h.toString(16);
  },

  async register(username, password) {
    if (!USERNAME_RULE.test(username)) throw new Error('用户名需要 2 到 16 个字符，可以用中文、字母、数字和下划线。');
    if (password.length < 6) throw new Error('密码至少 6 位。');
    if (await DB.get('users', username)) throw new Error('这个用户名已经被注册了，换一个试试。');
    const salt = this.newSalt();
    await DB.add('users', { username, salt, hash: await this.hash(password, salt), createdAt: Date.now() });
    await this.startSession(username);
  },

  async login(username, password) {
    const user = await DB.get('users', username);
    if (!user || (await this.hash(password, user.salt)) !== user.hash) {
      throw new Error('用户名或密码不对，请检查后再试。');
    }
    await this.startSession(username);
  },

  async changePassword(oldPassword, newPassword) {
    const user = await DB.get('users', this.user);
    if ((await this.hash(oldPassword, user.salt)) !== user.hash) throw new Error('现在的密码不对。');
    if (newPassword.length < 6) throw new Error('新密码至少 6 位。');
    user.salt = this.newSalt();
    user.hash = await this.hash(newPassword, user.salt);
    await DB.put('users', user);
  },

  // 登录状态也存在 IndexedDB 里，刷新页面后依然保持登录
  async startSession(username) {
    this.user = username;
    await DB.put('meta', { key: 'session', username, at: Date.now() });
  },
  async logout() {
    this.user = null;
    await DB.delete('meta', 'session');
  },
  async restore() {
    const session = await DB.get('meta', 'session');
    if (session && await DB.get('users', session.username)) this.user = session.username;
  },
};

/* =================================================================
 * 5. 媒体文件与封面的地址缓存
 *    IndexedDB 里存的是 Blob，要显示就得用 URL.createObjectURL 生成地址
 * ================================================================= */
const mediaCache = new Map(); // 媒体 id -> { id, type, name, url }
const coverCache = new Map(); // 卡片 id -> url 或 null

function rememberMedia(record) {
  if (!mediaCache.has(record.id)) {
    mediaCache.set(record.id, { id: record.id, type: record.type, name: record.name, url: URL.createObjectURL(record.blob) });
  }
  return mediaCache.get(record.id);
}
async function mediaInfo(id) {
  if (mediaCache.has(id)) return mediaCache.get(id);
  const record = await DB.get('media', id);
  return record ? rememberMedia(record) : null;
}
function forgetMedia(id) {
  const info = mediaCache.get(id);
  if (info) { URL.revokeObjectURL(info.url); mediaCache.delete(id); }
}

async function coverURL(itemId) {
  if (!coverCache.has(itemId)) {
    const record = await DB.get('covers', itemId);
    coverCache.set(itemId, record ? URL.createObjectURL(record.blob) : null);
  }
  return coverCache.get(itemId);
}
function forgetCover(itemId) {
  const url = coverCache.get(itemId);
  if (url) URL.revokeObjectURL(url);
  coverCache.delete(itemId);
}

// 页面渲染完后，把占位换成真正的封面图 / 媒体
async function hydrateCovers(root) {
  for (const el of $$('[data-cover]', root)) {
    const url = await coverURL(el.dataset.cover);
    if (url) el.innerHTML = `<img src="${url}" alt="${esc(el.dataset.alt || '')}">`;
  }
}
function mediaTag(info, alt) {
  if (info.type === 'image') return `<img src="${info.url}" alt="${esc(alt || info.name)}" loading="lazy">`;
  if (info.type === 'video') return `<video src="${info.url}" controls preload="metadata"></video>`;
  return `<audio src="${info.url}" controls preload="metadata"></audio>`;
}
async function hydrateMedia(root) {
  for (const el of $$('.md-media[data-media-id]', root)) {
    const info = await mediaInfo(Number(el.dataset.mediaId));
    if (info) {
      el.innerHTML = mediaTag(info, el.dataset.alt);
    } else {
      el.textContent = '这个媒体文件已经被删除了。';
      el.classList.add('missing');
    }
    el.removeAttribute('data-media-id');
  }
}

/* =================================================================
 * 6. Markdown 渲染器
 *    支持：标题、加粗、斜体、删除线、行内代码、代码块、引用、
 *          有序/无序列表、待办、表格、分割线、链接、图片，
 *          以及本站特有的 ![说明](media:编号) 用来插入媒体库里的文件
 *    先转义 HTML 再加格式，所以用户写的 <script> 不会被执行
 * ================================================================= */
const MD = {
  TABLE_SEP: /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/,
  LIST: /^\s*([-*+]|\d+\.)\s+/,
  HR: /^\s*([-*_])(\s*\1){2,}\s*$/,

  // 判断一行是不是某种"块"的开头（用来结束段落）
  isBlockStart(line, next) {
    return /^```/.test(line) || /^#{1,6}\s/.test(line) || /^>/.test(line)
      || this.HR.test(line) || this.LIST.test(line)
      || (line.includes('|') && next !== undefined && this.TABLE_SEP.test(next));
  },

  render(src) {
    const lines = src.replace(/\r\n?/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];

      // 代码块 ```
      if (/^```/.test(line)) {
        const code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++; // 跳过结尾的 ```
        html += `<pre><code>${esc(code.join('\n'))}</code></pre>`;
        continue;
      }
      // 空行
      if (!line.trim()) { i++; continue; }
      // 标题 # ~ ######
      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        const level = heading[1].length;
        html += `<h${level}>${this.inline(heading[2])}</h${level}>`;
        i++;
        continue;
      }
      // 分割线 ---
      if (this.HR.test(line)) { html += '<hr>'; i++; continue; }
      // 引用 >（里面可以再写 Markdown，所以递归渲染）
      if (/^>/.test(line)) {
        const quote = [];
        while (i < lines.length && /^>/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ''));
        html += `<blockquote>${this.render(quote.join('\n'))}</blockquote>`;
        continue;
      }
      // 表格
      if (line.includes('|') && i + 1 < lines.length && this.TABLE_SEP.test(lines[i + 1])) {
        html += this.table(lines, i);
        i += 2;
        while (i < lines.length && lines[i].includes('|') && lines[i].trim()) i++;
        continue;
      }
      // 列表
      if (this.LIST.test(line)) {
        const ordered = /^\s*\d+\./.test(line);
        const items = [];
        while (i < lines.length && this.LIST.test(lines[i])) items.push(lines[i++].replace(this.LIST, ''));
        const tag = ordered ? 'ol' : 'ul';
        html += `<${tag}>` + items.map(text => {
          const task = text.match(/^\[( |x|X)\]\s+(.*)$/);
          if (task) return `<li class="task"><input type="checkbox" disabled${task[1] !== ' ' ? ' checked' : ''}>${this.inline(task[2])}</li>`;
          return `<li>${this.inline(text)}</li>`;
        }).join('') + `</${tag}>`;
        continue;
      }
      // 普通段落：连续的行合成一段，行与行之间换行
      const para = [line];
      i++;
      while (i < lines.length && lines[i].trim() && !this.isBlockStart(lines[i], lines[i + 1])) para.push(lines[i++]);
      html += `<p>${para.map(l => this.inline(l)).join('<br>')}</p>`;
    }
    return html;
  },

  table(lines, start) {
    const cells = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    const head = cells(lines[start]);
    const aligns = cells(lines[start + 1]).map(c =>
      c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : '');
    const style = k => aligns[k] ? ` style="text-align:${aligns[k]}"` : '';
    const rows = [];
    for (let i = start + 2; i < lines.length && lines[i].includes('|') && lines[i].trim(); i++) rows.push(cells(lines[i]));
    return `<div class="table-wrap"><table>
      <thead><tr>${head.map((h, k) => `<th${style(k)}>${this.inline(h)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>${head.map((_, k) => `<td${style(k)}>${this.inline(r[k] || '')}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`;
  },

  // 只允许 http(s)、mailto 和页内链接，挡掉 javascript: 之类的地址
  safeURL(url) { return /^(https?:\/\/|mailto:|#)/i.test(url) ? url : null; },

  // 行内格式
  inline(text) {
    // 1) 先把 `代码` 取出来，避免里面的 * 等符号被当成格式
    const codes = [];
    text = text.replace(/`([^`]+)`/g, (_, code) => { codes.push(code); return `\u0000${codes.length - 1}\u0000`; });
    // 2) 转义 HTML
    text = esc(text);
    // 3) 图片和媒体 ![说明](地址)
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, url) => {
      const media = url.match(/^media:(\d+)$/);
      if (media) return `<span class="md-media" data-media-id="${media[1]}" data-alt="${alt}">正在加载${alt}</span>`;
      const safe = this.safeURL(url);
      return safe ? `<img src="${safe}" alt="${alt}" loading="lazy">` : alt;
    });
    // 4) 链接 [文字](地址)
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => {
      const safe = this.safeURL(url);
      return safe ? `<a href="${safe}" target="_blank" rel="noopener">${label}</a>` : label;
    });
    // 5) 加粗、斜体、删除线
    text = text
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>');
    // 6) 把代码放回去
    return text.replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${esc(codes[n])}</code>`);
  },
};

// 根据 key 找板块；板块已被删除时返回一个占位，避免页面出错
function Z(key) {

                            lead: '', href: '#sections', navKey: 'sections', bandClass: 'band-custom', builtin: false };

function entryToItem(e) {
  return {
    id: 'e' + e.id, entryId: e.id, zone: e.section, name: e.name,
    kind: e.kind || '', since: e.since || '', intro: e.intro || '',
    story: (e.story || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean),
    tags: e.tags || [], color: Z(e.section).color, art: null,
    custom: true, owner: e.owner,
  };
}
async function allItems() {
  const entries = await DB.getAll('entries');
  return [...ITEMS, ...entries.map(entryToItem)];
}
async function findItem(id = '') {
  if (/^e\d+$/.test(id)) {
    const e = await DB.get('entries', Number(id.slice(1)));
    return e ? entryToItem(e) : null;
  }
  return ITEMS.find(i => i.id === id) || null;
}

async function sectionTiles(list) {
  const items = await allItems();
  const posts = await DB.getAll('posts');
  return list.map(s => {
    const itemCount = items.filter(i => i.zone === s.key).length;
    const postCount = posts.filter(p => p.zone === s.key).length;
    return `<li><a class="section-tile" href="${s.href}" style="--c:${s.color}">
      <span class="section-name">${esc(s.name)}</span>
      <span class="section-lead">${esc(s.lead)}</span>
      <span class="section-count">${itemCount} 个条目，${postCount} 篇心得</span>
    </a></li>`;
  }).join('');
}

function band({ cls, title, lead, tabs, base, active, color, extra = '' }) {
  const tabsHTML = tabs ? `<nav class="subtabs" aria-label="子栏目">${
    tabs.map(([key, label]) => `<a href="#${base}/${key}"${key === active ? ' aria-current="page"' : ''}>${esc(label)}</a>`).join('')
  }</nav>` : '';
  return `<section class="band ${cls}${tabs ? '' : ' no-tabs'}"${color ? ` style="--band:${color}"` : ''}><div class="wrap">
    <h1 class="band-title">${title}</h1>
    <p class="band-lead">${lead}</p>
    ${extra}
    ${tabsHTML}
  </div></section>`;
}

async function viewZone(key, sub = 'intro') {
  const S = SECTIONS[key];
  if (!S) return notFound('这个板块不存在，可能已经被删除了。');
  const tabs = [['intro', S.itemsLabel], ['notes', S.noteName]];
  if (!tabs.some(([k]) => k === sub)) sub = 'intro';
  const mine = !S.builtin && S.owner === Auth.user;
  let body;

  if (sub === 'intro') {
    const items = (await allItems()).filter(i => i.zone === key);
    // 自建板块的主人可以添加条目、编辑或删除板块
    const manage = mine ? `<div class="actions">
        <button class="btn primary" data-action="new-entry" data-section="${key}">添加条目</button>
        <button class="btn" data-action="edit-section" data-id="${S.id}">编辑板块</button>
        <button class="btn danger" data-action="delete-section" data-id="${S.id}">删除板块</button>
      </div>` : '';
    body = (S.builtin ? '' : `<div class="list-head"><p class="muted">共 ${items.length} 个条目。</p>${manage}</div>`)
      + (items.length
        ? `<div class="item-grid">${items.map(itemCard).join('')}</div>`
        : emptyHTML(mine ? '这个板块还没有条目。点“添加条目”，写下第一个。' : '这个板块还没有条目。'));
  } else {
    const posts = (await DB.getByIndex('posts', 'zone', key)).sort(byNewest);
    body = `<div class="list-head">
        <p class="muted">共 ${posts.length} 篇${esc(S.noteName)}，新写的在前面。</p>
        ${writeButton(key)}
      </div>
      ${posts.length ? postList(posts) : emptyHTML(`还没有${esc(S.noteName)}。`)}`;
  }

  return {
    html: band({
      cls: S.bandClass, title: esc(S.name), lead: esc(S.lead), tabs, base: S.href.slice(1), active: sub,
      color: S.builtin ? '' : S.color,

    }) + `<div class="wrap page">${body}</div>`,
    nav: S.navKey,
    title: S.name,
  };
}

/* ----- 8.5.1 写心得：Markdown 编辑器 ----- */

// 编辑器工具栏：label 是按钮上的字，run 是点击后对输入框做的事
const TOOLBAR = [
  { label: '标题', title: '二级标题', run: ta => prefixLines(ta, '## ') },
  { label: 'B', title: '加粗（Ctrl+B）', cls: 'b', run: ta => wrapSelection(ta, '**') },
  { label: 'I', title: '斜体（Ctrl+I）', cls: 'i', run: ta => wrapSelection(ta, '*') },
  { label: 'S', title: '删除线', cls: 's', run: ta => wrapSelection(ta, '~~') },
  'sep',
  { label: '引用', run: ta => prefixLines(ta, '> ') },
  { label: '列表', run: ta => prefixLines(ta, '- ') },
  { label: '编号', run: ta => prefixLines(ta, k => `${k + 1}. `) },
  { label: '待办', run: ta => prefixLines(ta, '- [ ] ') },
  'sep',
  { label: '代码', run: ta => insertBlock(ta, '```\n' + (selectedText(ta) || '在这里写代码') + '\n```') },
  { label: '链接', run: ta => wrapSelection(ta, '[', '](https://)', '链接文字') },
  { label: '表格', run: ta => insertBlock(ta, '| 项目 | 内容 |\n| --- | --- |\n| 示例 | 示例 |') },
  { label: '分割线', run: ta => insertBlock(ta, '---') },
  'sep',
  { label: '插入图片、视频或音频', cls: 'media', run: ta => openMediaPicker(ta) },
];

const selectedText = ta => ta.value.slice(ta.selectionStart, ta.selectionEnd);
const notifyInput = ta => { ta.focus(); ta.dispatchEvent(new Event('input')); };

// 在选中文字两边加符号，比如 **加粗**
function wrapSelection(ta, before, after = before, placeholder = '文字') {
  const start = ta.selectionStart;
  const text = selectedText(ta) || placeholder;
  ta.setRangeText(before + text + after, start, ta.selectionEnd, 'end');
  ta.setSelectionRange(start + before.length, start + before.length + text.length);
  notifyInput(ta);
}
// 给选中的每一行加前缀，比如 "- " 变成列表
function prefixLines(ta, prefix) {
  const v = ta.value;
  const start = v.lastIndexOf('\n', ta.selectionStart - 1) + 1;
  let end = v.indexOf('\n', ta.selectionEnd);
  if (end === -1) end = v.length;
  const block = v.slice(start, end).split('\n')
    .map((line, k) => (typeof prefix === 'function' ? prefix(k) : prefix) + line).join('\n');
  ta.setRangeText(block, start, end, 'select');
  notifyInput(ta);
}
// 插入一整块内容，前面自动空一行
function insertBlock(ta, text) {
  const s = ta.selectionStart, v = ta.value;
  let before = '';
  if (s > 0) before = v[s - 1] !== '\n' ? '\n\n' : (s > 1 && v[s - 2] !== '\n' ? '\n' : '');
  ta.setRangeText(before + text + '\n', s, ta.selectionEnd, 'end');
  notifyInput(ta);
}

async function journalWrite(head, id) {
  let post = null;
  if (id) {
    post = await DB.get('posts', Number(id));
    if (!post || post.author !== Auth.user) {
      return { html: head + `<div class="wrap page">${emptyHTML('找不到这篇心得，或者它不是你写的，不能编辑。', '<a class="btn" href="#journal/write">写一篇新的</a>')}</div>`,
               nav: 'journal', title: '写心得' };
    }
  }
  const zone = post ? post.zone : 'game';
  const toolbar = TOOLBAR.map((t, i) => t === 'sep'
    ? '<span class="sep" aria-hidden="true"></span>'
    : `<button type="button" class="${t.cls || ''}" data-tool="${i}" title="${t.title || t.label}" aria-label="${t.title || t.label}">${t.label}</button>`).join('');

  const html = head + `<div class="wrap page">
    <form class="editor" id="editorForm" novalidate>
      <div class="editor-head">
        <label class="sr" for="postTitle">标题</label>
        <input id="postTitle" class="title-input" placeholder="给这篇心得起个标题" maxlength="60" value="${esc(post ? post.title : '')}">
        <label class="zone-select"><span class="sr">发布到哪个板块</span>
          <select id="postZone">${Object.values(SECTIONS).map(sec =>
            `<option value="${sec.key}"${sec.key === zone ? ' selected' : ''}>${esc(sec.noteName)}</option>`).join('')}</select>
        </label>
      </div>
      <div class="toolbar" role="toolbar" aria-label="格式">${toolbar}</div>
      <div class="editor-switch" role="group" aria-label="切换编辑和预览">
        <button type="button" data-show="edit" aria-pressed="true">编辑</button>
        <button type="button" data-show="preview" aria-pressed="false">预览</button>
      </div>
      <div class="panes" data-show="edit">
        <label class="edit-pane"><span class="sr">正文，支持 Markdown</span>
          <textarea id="postBody" placeholder="用 Markdown 写正文，右边会实时显示效果。&#10;&#10;## 小标题&#10;**加粗**、*斜体*、- 列表、> 引用&#10;&#10;点工具栏右边的黄色按钮，可以插入图片、视频或音频。">${esc(post ? post.content : '')}</textarea>
        </label>
        <div class="preview md-body" id="preview" aria-label="预览"></div>
      </div>
      <div class="editor-foot">
        <span class="count" id="wordCount">0 字</span>
        <span class="hint">${post ? 'Ctrl+S 保存修改' : 'Ctrl+S 发布，没发布的内容会自动存成草稿'}</span>
        ${post ? `<a class="btn" href="#post/${post.id}">取消编辑</a>` : `<button type="button" class="btn ghost" id="clearDraft">清空</button>`}
        <button type="submit" class="btn primary">${post ? '保存修改' : '发布心得'}</button>
      </div>
    </form>
  </div>`;
  return { html, nav: 'journal', title: post ? '编辑心得' : '写心得', mount: () => mountEditor(post) };
}

function mountEditor(post) {
  const form = $('#editorForm');
  const title = $('#postTitle');
  const body = $('#postBody');
  const preview = $('#preview');
  const draftKey = `two-halves-draft-${Auth.user}`;
  const getZone = () => $('#postZone').value;
  const setZone = zone => { if (SECTIONS[zone]) $('#postZone').value = zone; };

  // 新建时：优先用详情页带过来的预设，否则恢复上次的草稿
  if (!post) {
    if (state.pendingDraft) {
      setZone(state.pendingDraft.zone);
      if (state.pendingDraft.about) title.value = `关于${state.pendingDraft.about}`;
      state.pendingDraft = null;
    } else {
      try {
        const draft = JSON.parse(local.get(draftKey) || 'null');
        if (draft && (draft.title || draft.content)) {
          title.value = draft.title; body.value = draft.content; setZone(draft.zone);
          toast('已恢复上次没发布的草稿');
        }
      } catch { /* 草稿损坏就忽略 */ }
    }
  }

  // 发布后或离开页面后，延迟执行的预览和草稿保存就不再运行
  let finished = false;
  const active = () => !finished && form.isConnected;

  // 实时预览和字数
  const updatePreview = () => {
    if (!active()) return;
    preview.innerHTML = body.value.trim() ? MD.render(body.value) : '<p class="muted">预览会显示在这里。</p>';
    hydrateMedia(preview);
    $('#wordCount').textContent = `${body.value.replace(/\s/g, '').length} 字`;
  };
  const saveDraft = debounce(() => {
    if (!post && active()) local.set(draftKey, JSON.stringify({ title: title.value, content: body.value, zone: getZone() }));
  }, 400);
  body.addEventListener('input', debounce(updatePreview, 120));
  body.addEventListener('input', saveDraft);
  title.addEventListener('input', saveDraft);
  form.addEventListener('change', saveDraft);
  updatePreview();

  // 工具栏
  $('.toolbar', form).addEventListener('click', e => {
    const btn = e.target.closest('[data-tool]');
    if (btn) TOOLBAR[btn.dataset.tool].run(body);
  });

  // 快捷键
  form.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    const key = e.key.toLowerCase();
    if (key === 's') { e.preventDefault(); form.requestSubmit(); }
    if (key === 'b' && e.target === body) { e.preventDefault(); wrapSelection(body, '**'); }
    if (key === 'i' && e.target === body) { e.preventDefault(); wrapSelection(body, '*'); }
  });

  // 手机上切换"编辑 / 预览"
  $('.editor-switch', form).addEventListener('click', e => {
    const btn = e.target.closest('[data-show]');
    if (!btn) return;
    $('.panes', form).dataset.show = btn.dataset.show;
    $$('.editor-switch button', form).forEach(b => b.setAttribute('aria-pressed', b === btn));
  });

  $('#clearDraft')?.addEventListener('click', () => {
    if ((title.value || body.value) && !confirm('清空标题和正文吗？')) return;
    title.value = ''; body.value = '';
    local.remove(draftKey);
    updatePreview();
    title.focus();
  });

  // 发布 / 保存
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!title.value.trim()) { toast('先给心得起个标题'); title.focus(); return; }
    if (!body.value.trim()) { toast('正文还是空的'); body.focus(); return; }
    finished = true;
    const now = Date.now();
    let id;
    if (post) {
      await DB.put('posts', { ...post, title: title.value.trim(), content: body.value, zone: getZone(), updatedAt: now });
      id = post.id;
      toast('已保存修改');
    } else {
      id = await DB.add('posts', { title: title.value.trim(), content: body.value, zone: getZone(), author: Auth.user, createdAt: now, updatedAt: now });
      local.remove(draftKey);
      toast('心得已发布');
    }
    go(`#post/${id}`);
  });
}

/* ----- 8.5.2 随手记 ----- */
async function journalNotes(head) {
  const notes = (await DB.getByIndex('notes', 'owner', Auth.user)).sort(byNewest);

  // 按日期分组
  const groups = [];
  for (const n of notes) {
    const day = fmtDay(n.createdAt);
    if (!groups.length || groups[groups.length - 1].day !== day) groups.push({ day, notes: [] });
    groups[groups.length - 1].notes.push(n);
  }
  const timeline = groups.map(g => `
    <h2 class="day">${g.day}</h2>
    <ul class="notes">${g.notes.map(n => `
      <li class="note z-${n.tag}">
        <div class="note-head">
          <time>${fmtTime(n.createdAt)}</time><span class="chip">${NOTE_TAGS[n.tag]}</span>
          <button class="btn ghost small" data-action="delete-note" data-id="${n.id}" aria-label="删除这条随手记">删除</button>
        </div>
        <p class="note-text">${esc(n.text)}</p>
      </li>`).join('')}
    </ul>`).join('');

  const html = head + `<div class="wrap page">
    <form class="composer" id="noteForm">
      <label class="sr" for="noteText">随手记</label>
      <textarea id="noteText" placeholder="今天发生了什么？随手记一句。" maxlength="1000"></textarea>
      <div class="composer-row">
        <fieldset class="seg"><legend class="sr">分类</legend>
          ${Object.entries(NOTE_TAGS).map(([key, label], k) =>
            `<label><input type="radio" name="tag" value="${key}"${k === 0 ? ' checked' : ''}><span>${label}</span></label>`).join('')}
        </fieldset>
        <span class="hint">Ctrl+Enter 也能记下</span>
        <button class="btn primary" type="submit">记下</button>
      </div>
    </form>
    ${notes.length ? timeline : emptyHTML('还没有随手记。在上面的框里写一句话，按“记下”就行。')}
  </div>`;

  const mount = () => {
    const form = $('#noteForm');
    const text = $('#noteText');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!text.value.trim()) { toast('先写点什么再记下'); text.focus(); return; }
      await DB.add('notes', { owner: Auth.user, tag: form.tag.value, text: text.value.trim(), createdAt: Date.now() });
      toast('已记下');
      render();
    });
    text.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') form.requestSubmit();
    });
  };
  return { html, nav: 'journal', title: '随手记', mount };
}

/* ----- 8.5.3 媒体库 ----- */
async function uploadFiles(fileList) {
  const ids = [];
  const skipped = [];
  for (const file of fileList) {
    const type = file.type.split('/')[0];
    if (!TYPE_NAME[type]) { skipped.push(`${file.name}（不是图片、视频或音频）`); continue; }
    if (file.size > MAX_FILE_SIZE) { skipped.push(`${file.name}（超过 200 MB）`); continue; }
    ids.push(await DB.add('media', {
      owner: Auth.user, name: file.name, type, mime: file.type, size: file.size,
      blob: file, // File 本身就是 Blob，可以直接存进 IndexedDB
      createdAt: Date.now(),
    }));
  }
  if (skipped.length) alert('这些文件没有上传：\n' + skipped.join('\n'));
  if (ids.length) toast(`已上传 ${ids.length} 个文件`);
  return ids;
}

function mediaTile(m) {
  const info = rememberMedia(m);
  let face;
  if (m.type === 'image') {
    face = `<button type="button" class="tile-face tile-view" data-action="lightbox" data-id="${m.id}" aria-label="放大查看 ${esc(m.name)}">
              <img src="${info.url}" alt="" loading="lazy"></button>`;
  } else if (m.type === 'video') {
    face = `<video class="tile-face" src="${info.url}" controls preload="metadata"></video>`;
  } else {
    const ext = m.name.includes('.') ? m.name.split('.').pop().toUpperCase().slice(0, 5) : '音频';
    face = `<div class="tile-face audio-face" aria-hidden="true">${esc(ext)}</div><audio src="${info.url}" controls preload="none"></audio>`;
  }
  return `<li class="tile">${face}
    <div class="tile-info">
      <p class="tile-name" title="${esc(m.name)}">${esc(m.name)}</p>
      <p class="tile-meta">${TYPE_NAME[m.type]}，${fmtSize(m.size)}，${fmtDate(m.createdAt)}</p>
      <div class="tile-actions">
        ${favButton('media', m.id, m.name)}
        <button class="btn small danger" data-action="delete-media" data-id="${m.id}">删除</button>
      </div>
    </div>
  </li>`;
}

async function journalMedia(head, filter = 'all') {
  const filters = [['all', '全部'], ['image', '图片'], ['video', '视频'], ['audio', '音频']];
  if (!filters.some(([key]) => key === filter)) filter = 'all';
  const all = (await DB.getByIndex('media', 'owner', Auth.user)).sort(byNewest);
  const shown = filter === 'all' ? all : all.filter(m => m.type === filter);
  const countOf = key => key === 'all' ? all.length : all.filter(m => m.type === key).length;
  const totalSize = all.reduce((sum, m) => sum + m.size, 0);

  const html = head + `<div class="wrap page">
    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" class="sr" multiple accept="image/*,video/*,audio/*">
      <strong>把图片、视频或音频拖到这里</strong>
      <span>也可以点击这里选择文件，一次可以选多个，单个文件不超过 200 MB</span>
    </label>
    <div class="media-bar">
      <nav class="chips" aria-label="按类型筛选">
        ${filters.map(([key, label]) => `<a href="#journal/media/${key}"${key === filter ? ' aria-current="page"' : ''}>${label} ${countOf(key)}</a>`).join('')}
      </nav>
      <span class="usage" id="usage">共 ${all.length} 个文件，${fmtSize(totalSize)}</span>
    </div>
    ${shown.length
      ? `<ul class="media-grid">${shown.map(mediaTile).join('')}</ul>`
      : emptyHTML(all.length ? `还没有${TYPE_NAME[filter]}。` : '媒体库还是空的。上传的照片、视频和音频会出现在这里，写心得时可以插进正文。')}
  </div>`;

  const mount = () => {
    const zone = $('#dropzone');
    $('#fileInput').addEventListener('change', async e => {
      const ids = await uploadFiles(e.target.files);
      e.target.value = '';
      if (ids.length) render();
    });
    // 拖拽上传
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('is-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('is-over'));
    zone.addEventListener('drop', async e => {
      e.preventDefault();
      zone.classList.remove('is-over');
      const ids = await uploadFiles(e.dataTransfer.files);
      if (ids.length) render();
    });
    // 显示浏览器给这个网站的存储空间
    navigator.storage?.estimate?.().then(({ usage, quota }) => {
      const el = $('#usage');
      if (el && quota) el.textContent += `。本站已用 ${fmtSize(usage)}，浏览器最多允许约 ${fmtSize(quota)}`;
    });
  };
  return { html, nav: 'journal', title: '媒体库', mount };
}
